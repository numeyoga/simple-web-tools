<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- Sets data-theme, data-text-size and lang before the first paint (a classic script: no inline
         script, so the strict CSP can forbid them). The interface language is chosen again, with
         the same rule, by src/adapters/i18n.js. -->
    <script src="./theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body data-screen-label="Dashboard">
    <div id="root"></div>
  </body>
</html>
