<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script src="./theme-init.js"></script>
    <title>Locavern</title>
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="cv-shell">
      <a class="cv-skip-link" href="#shell-main" data-i18n="shell.skipLink"></a>

      <nav class="cv-sidebar" id="shell-nav" data-i18n-attrs="aria-label:shell.mainNav">
        <!-- Replaced at startup by the suite's brand (adapters/dom/app-shell.js, mountSuiteChrome). -->
        <div class="cv-sidebar__brand" id="shell-brand"></div>

        <ul>
          <li>
            <a class="cv-nav-item" href="#today" data-nav-view="today">
              <i class="ph ph-sun cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.today"></span>
            </a>
          </li>
          <li>
            <a class="cv-nav-item" href="#tasks" data-nav-view="tasks" aria-current="page">
              <i class="ph ph-list-checks cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.tasks"></span>
            </a>
          </li>
          <li>
            <a class="cv-nav-item" href="#projects" data-nav-view="projects">
              <i class="ph ph-folder-open cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.projects"></span>
            </a>
          </li>
          <li>
            <a class="cv-nav-item" href="#calendar" data-nav-view="calendar">
              <i class="ph ph-calendar-blank cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.calendar"></span>
            </a>
          </li>
          <li>
            <a class="cv-nav-item" href="#notes" data-nav-view="notes">
              <i class="ph ph-notebook cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.notes"></span>
            </a>
          </li>
          <li>
            <a class="cv-nav-item" href="#whiteboards" data-nav-view="whiteboards">
              <i class="ph ph-chalkboard-simple cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.whiteboards"></span>
            </a>
          </li>
          <li>
            <a class="cv-nav-item" href="#archives" data-nav-view="archives">
              <i class="ph ph-archive cv-icon" aria-hidden="true"></i>
              <span data-i18n="common.archives"></span>
              <span class="cv-badge lc-nav-badge" id="nav-archives-count" hidden>0</span>
            </a>
          </li>
        </ul>

        <div class="cv-overline cv-sidebar__group" data-i18n="shell.navData"></div>
        <ul>
          <li>
            <button
              type="button"
              class="cv-nav-item lc-nav-btn"
              id="nav-backup-btn"
              data-cv-open="modal-backup"
            >
              <i class="ph ph-database cv-icon" aria-hidden="true"></i>
              <span data-i18n="shell.navBackup"></span>
            </button>
          </li>
          <li>
            <button
              type="button"
              class="cv-nav-item lc-nav-btn"
              id="nav-trash-btn"
              data-cv-open="modal-trash"
            >
              <i class="ph ph-trash cv-icon" aria-hidden="true"></i>
              <span data-i18n="shell.navTrash"></span>
              <span class="cv-badge lc-nav-badge" id="nav-trash-count" hidden>0</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="cv-shell__scrim"></div>

      <div class="cv-shell__main">
        <header class="cv-topbar">
          <button
            type="button"
            class="cv-btn cv-btn--ghost cv-btn--icon cv-shell__menu"
            data-cv-nav-toggle
            aria-controls="shell-nav"
            aria-expanded="false"
            data-i18n-attrs="aria-label:shell.openMenu;data-cv-tooltip:shell.navMenu"
          >
            <i class="ph ph-list cv-icon" aria-hidden="true"></i>
          </button>

          <h1 class="cv-topbar__title" id="topbar-title" data-i18n="common.tasks"></h1>
          <span class="cv-topbar__spacer"></span>

          <button
            type="button"
            class="cv-search"
            data-cv-open="cmd-menu"
            data-i18n-attrs="aria-label:palette.openLabel;data-cv-tooltip:palette.openTooltip"
          >
            <i class="ph ph-magnifying-glass cv-icon" aria-hidden="true"></i>
            <span class="cv-search__label" data-i18n="common.search"></span>
            <kbd class="cv-kbd">Ctrl+K</kbd>
          </button>

          <button
            type="button"
            class="cv-btn cv-btn--ghost cv-btn--icon"
            id="topbar-preferences-btn"
            data-cv-open="modal-preferences"
            data-i18n-attrs="aria-label:shell.preferences;data-cv-tooltip:shell.preferences"
          >
            <i class="ph ph-gear cv-icon" aria-hidden="true"></i>
          </button>
        </header>

        <main class="cv-shell__content lc-main" id="shell-main" tabindex="-1">
          <div id="sw-update-slot" aria-live="polite"></div>
          <div id="readonly-banner-slot" aria-live="polite"></div>
          <div id="app-view"></div>
        </main>
      </div>
    </div>

    <!-- Command Menu (Ctrl+K / Cmd+K) -->
    <dialog
      class="cv-cmd"
      id="cmd-menu"
      data-cv-shortcut="mod+k"
      data-i18n-attrs="aria-label:palette.title"
    >
      <div class="cv-combobox" data-cv-inline data-cv-combobox="1">
        <div class="cv-cmd__search">
          <i class="ph ph-magnifying-glass cv-icon" aria-hidden="true"></i>
          <input
            class="cv-cmd__input"
            type="text"
            role="combobox"
            aria-expanded="true"
            aria-controls="cmd-list"
            autocomplete="off"
            data-i18n-attrs="aria-label:palette.inputLabel;placeholder:palette.placeholder"
          />
          <kbd class="cv-kbd">esc</kbd>
        </div>
        <ul
          class="cv-listbox"
          id="cmd-list"
          role="listbox"
          data-i18n-attrs="aria-label:palette.listLabel"
        >
          <li class="cv-option" role="option" data-value="view:today">
            <i class="ph ph-sun cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goToday"></span>
          </li>
          <li class="cv-option" role="option" data-value="view:tasks">
            <i class="ph ph-list-checks cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goTasks"></span>
          </li>
          <li class="cv-option" role="option" data-value="view:projects">
            <i class="ph ph-folder-open cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goProjects"></span>
          </li>
          <li class="cv-option" role="option" data-value="view:calendar">
            <i class="ph ph-calendar-blank cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goCalendar"></span>
          </li>
          <li class="cv-option" role="option" data-value="view:notes">
            <i class="ph ph-notebook cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goNotes"></span>
          </li>
          <li class="cv-option" role="option" data-value="view:whiteboards">
            <i class="ph ph-chalkboard-simple cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goWhiteboards"></span>
          </li>
          <li class="cv-option" role="option" data-value="view:archives">
            <i class="ph ph-archive cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.goArchive"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:new-task">
            <i class="ph ph-plus cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.newTask"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:new-project">
            <i class="ph ph-folder-plus cv-icon" aria-hidden="true"></i>
            <span data-i18n="projects.createCta"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:new-note">
            <i class="ph ph-note-pencil cv-icon" aria-hidden="true"></i>
            <span data-i18n="notes.createCta"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:new-whiteboard">
            <i class="ph ph-chalkboard-simple cv-icon" aria-hidden="true"></i>
            <span data-i18n="whiteboards.createCta"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:open-statuses">
            <i class="ph ph-columns cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.statuses"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:open-backup">
            <i class="ph ph-database cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.openBackup"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:open-trash">
            <i class="ph ph-trash cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.openTrash"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:open-preferences">
            <i class="ph ph-sliders-horizontal cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.openPreferences"></span>
          </li>
          <li class="cv-option" role="option" data-value="action:toggle-theme">
            <i class="ph ph-moon cv-icon" aria-hidden="true"></i>
            <span data-i18n="palette.toggleTheme"></span>
          </li>
          <li class="cv-listbox__empty" hidden data-i18n="palette.noResults"></li>
        </ul>
      </div>
    </dialog>

    <!-- Task Create/Edit Dialog -->
    <dialog
      class="cv-drawer lc-entry-dialog"
      id="drawer-task"
      closedby="any"
      aria-labelledby="drawer-task-title"
    >
      <header class="cv-drawer__header">
        <h2 class="cv-drawer__title" id="drawer-task-title" data-i18n="shell.dialogTask"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-drawer__body" id="drawer-task-body"></div>
      <footer class="cv-drawer__footer" id="drawer-task-footer"></footer>
    </dialog>

    <!-- Project Create/Edit Dialog -->
    <dialog
      class="cv-modal lc-entry-dialog"
      id="modal-project"
      closedby="any"
      aria-labelledby="modal-project-title"
    >
      <header class="cv-modal__header">
        <h2 class="cv-modal__title" id="modal-project-title" data-i18n="projects.newTitle"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body" id="modal-project-body"></div>
      <footer class="cv-modal__footer" id="modal-project-footer"></footer>
    </dialog>

    <!-- Note Create/Edit Dialog -->
    <dialog
      class="cv-drawer lc-entry-dialog"
      id="dialog-note"
      closedby="any"
      aria-labelledby="dialog-note-title"
    >
      <header class="cv-drawer__header">
        <h2 class="cv-drawer__title" id="dialog-note-title" data-i18n="notes.new"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-drawer__body" id="dialog-note-body"></div>
      <footer class="cv-drawer__footer" id="dialog-note-footer"></footer>
    </dialog>

    <!-- Whiteboard Create/Edit Dialog -->
    <dialog
      class="cv-modal lc-entry-dialog"
      id="dialog-whiteboard"
      closedby="any"
      aria-labelledby="dialog-whiteboard-title"
    >
      <header class="cv-modal__header">
        <h2 class="cv-modal__title" id="dialog-whiteboard-title" data-i18n="whiteboards.new"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body" id="dialog-whiteboard-body"></div>
      <footer class="cv-modal__footer" id="dialog-whiteboard-footer"></footer>
    </dialog>

    <!-- Whiteboard Maximum Size Dialog -->
    <dialog
      class="cv-modal lc-wb-max-dialog"
      id="dialog-whiteboard-max"
      closedby="any"
      aria-labelledby="dialog-whiteboard-max-title"
    >
      <header class="cv-modal__header">
        <h2
          class="cv-modal__title"
          id="dialog-whiteboard-max-title"
          data-i18n="common.whiteboard"
        ></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body lc-wb-max-dialog__body" id="dialog-whiteboard-max-body"></div>
    </dialog>

    <!-- Destructive Confirmation Modal -->
    <dialog class="cv-modal" id="modal-confirm" aria-labelledby="modal-confirm-title">
      <header class="cv-modal__header">
        <h2
          class="cv-modal__title"
          id="modal-confirm-title"
          data-i18n="shell.dialogConfirmDelete"
        ></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body" id="modal-confirm-body"></div>
      <footer class="cv-modal__footer" id="modal-confirm-footer"></footer>
    </dialog>

    <!-- Local Trash Modal -->
    <dialog
      class="cv-modal lc-modal--wide"
      id="modal-trash"
      closedby="any"
      aria-labelledby="modal-trash-title"
    >
      <header class="cv-modal__header">
        <h2 class="cv-modal__title" id="modal-trash-title" data-i18n="shell.dialogTrash"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body" id="modal-trash-body"></div>
      <footer class="cv-modal__footer" id="modal-trash-footer">
        <button type="button" class="cv-btn" data-cv-close data-i18n="common.close"></button>
      </footer>
    </dialog>

    <!-- Backup & Storage Modal -->
    <dialog class="cv-modal lc-modal--wide" id="modal-backup" aria-labelledby="modal-backup-title">
      <header class="cv-modal__header">
        <h2 class="cv-modal__title" id="modal-backup-title" data-i18n="shell.dialogBackup"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body" id="modal-backup-body"></div>
      <footer class="cv-modal__footer">
        <button type="button" class="cv-btn" data-cv-close data-i18n="common.close"></button>
      </footer>
    </dialog>

    <!-- Kanban Statuses Configuration Modal -->
    <dialog
      class="cv-modal"
      id="modal-statuses"
      closedby="any"
      aria-labelledby="modal-statuses-title"
    >
      <header class="cv-modal__header">
        <h2 class="cv-modal__title" id="modal-statuses-title" data-i18n="shell.dialogStatuses"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body" id="modal-statuses-body"></div>
      <footer class="cv-modal__footer" id="modal-statuses-footer"></footer>
    </dialog>

    <!-- Display Preferences Modal -->
    <dialog
      class="cv-modal"
      id="modal-preferences"
      closedby="any"
      aria-labelledby="modal-preferences-title"
    >
      <header class="cv-modal__header">
        <h2 class="cv-modal__title" id="modal-preferences-title" data-i18n="prefs.title"></h2>
        <button
          type="button"
          class="cv-btn cv-btn--ghost cv-btn--icon"
          data-cv-close
          data-i18n-attrs="aria-label:common.close;data-cv-tooltip:common.close"
        >
          <i class="ph ph-x cv-icon" aria-hidden="true"></i>
        </button>
      </header>
      <div class="cv-modal__body">
        <div class="cv-field">
          <label class="cv-label" for="pref-language" data-i18n="prefs.language"></label>
          <span class="cv-select">
            <select
              class="cv-input"
              id="pref-language"
              name="language"
              aria-describedby="pref-language-hint"
            >
              <option value="auto" data-i18n="prefs.languageAuto"></option>
              <option value="en" data-i18n="prefs.languageEnglish"></option>
              <option value="fr" data-i18n="prefs.languageFrench"></option>
            </select>
          </span>
          <span class="cv-hint" id="pref-language-hint" data-i18n="prefs.languageHint"></span>
        </div>

        <div class="cv-field">
          <span class="cv-label" aria-hidden="true" data-i18n="prefs.theme"></span>
          <fieldset class="cv-segmented" data-theme-control aria-describedby="pref-theme-hint">
            <legend data-i18n="prefs.theme"></legend>
            <label
              ><input type="radio" name="theme" value="system" checked /><span
                data-i18n="prefs.themeSystem"
              ></span
            ></label>
            <label
              ><input type="radio" name="theme" value="light" /><span
                data-i18n="prefs.themeLight"
              ></span
            ></label>
            <label
              ><input type="radio" name="theme" value="dark" /><span
                data-i18n="prefs.themeDark"
              ></span
            ></label>
          </fieldset>
          <span class="cv-hint" id="pref-theme-hint" data-i18n="prefs.themeHint"></span>
        </div>

        <div class="cv-field">
          <span class="cv-label" aria-hidden="true" data-i18n="prefs.textSize"></span>
          <fieldset
            class="cv-segmented"
            data-cv-text-size-control
            aria-describedby="pref-text-size-hint"
          >
            <legend data-i18n="prefs.textSize"></legend>
            <label
              ><input type="radio" name="text-size" value="auto" checked /><span
                data-i18n="prefs.textSizeAuto"
              ></span
            ></label>
            <label
              ><input type="radio" name="text-size" value="standard" /><span
                data-i18n="prefs.textSizeStandard"
              ></span
            ></label>
            <label
              ><input type="radio" name="text-size" value="comfortable" /><span
                data-i18n="prefs.textSizeComfortable"
              ></span
            ></label>
            <label
              ><input type="radio" name="text-size" value="large" /><span
                data-i18n="prefs.textSizeLarge"
              ></span
            ></label>
          </fieldset>
          <span class="cv-hint" id="pref-text-size-hint" data-i18n="prefs.textSizeHint"></span>
        </div>

        <div class="cv-field">
          <span
            class="cv-label"
            id="pref-input-presentation-label"
            aria-hidden="true"
            data-i18n="prefs.inputPresentation"
          ></span>
          <div
            class="lc-pref-input-list"
            role="group"
            aria-labelledby="pref-input-presentation-label"
            aria-describedby="pref-input-presentation-hint"
          >
            <div class="lc-pref-input-row">
              <span
                class="lc-pref-input-row__label"
                aria-hidden="true"
                data-i18n="common.tasks"
              ></span>
              <fieldset class="cv-segmented" data-input-screen="tasks">
                <legend data-i18n="prefs.inputForTasks"></legend>
                <label>
                  <input type="radio" name="input-presentation-tasks" value="drawer" checked />
                  <span data-i18n="prefs.drawer"></span>
                </label>
                <label>
                  <input type="radio" name="input-presentation-tasks" value="modal" />
                  <span data-i18n="prefs.modal"></span>
                </label>
              </fieldset>
            </div>

            <div class="lc-pref-input-row">
              <span
                class="lc-pref-input-row__label"
                aria-hidden="true"
                data-i18n="common.projects"
              ></span>
              <fieldset class="cv-segmented" data-input-screen="projects">
                <legend data-i18n="prefs.inputForProjects"></legend>
                <label>
                  <input type="radio" name="input-presentation-projects" value="drawer" />
                  <span data-i18n="prefs.drawer"></span>
                </label>
                <label>
                  <input type="radio" name="input-presentation-projects" value="modal" checked />
                  <span data-i18n="prefs.modal"></span>
                </label>
              </fieldset>
            </div>

            <div class="lc-pref-input-row">
              <span
                class="lc-pref-input-row__label"
                aria-hidden="true"
                data-i18n="common.notes"
              ></span>
              <fieldset class="cv-segmented" data-input-screen="notes">
                <legend data-i18n="prefs.inputForNotes"></legend>
                <label>
                  <input type="radio" name="input-presentation-notes" value="drawer" checked />
                  <span data-i18n="prefs.drawer"></span>
                </label>
                <label>
                  <input type="radio" name="input-presentation-notes" value="modal" />
                  <span data-i18n="prefs.modal"></span>
                </label>
              </fieldset>
            </div>

            <div class="lc-pref-input-row">
              <span
                class="lc-pref-input-row__label"
                aria-hidden="true"
                data-i18n="common.whiteboards"
              ></span>
              <fieldset class="cv-segmented" data-input-screen="whiteboards">
                <legend data-i18n="prefs.inputForWhiteboards"></legend>
                <label>
                  <input type="radio" name="input-presentation-whiteboards" value="drawer" />
                  <span data-i18n="prefs.drawer"></span>
                </label>
                <label>
                  <input type="radio" name="input-presentation-whiteboards" value="modal" checked />
                  <span data-i18n="prefs.modal"></span>
                </label>
              </fieldset>
            </div>
          </div>
          <span
            class="cv-hint"
            id="pref-input-presentation-hint"
            data-i18n="prefs.inputPresentationHint"
          ></span>
        </div>

        <div class="cv-field">
          <label class="cv-label" for="pref-toast-duration" data-i18n="prefs.toastDuration"></label>
          <input
            class="cv-input cv-input--mono lc-pref-duration-input"
            id="pref-toast-duration"
            name="toast-duration-seconds"
            type="number"
            min="1"
            max="60"
            step="1"
            inputmode="numeric"
            value="6"
            required
            aria-describedby="pref-toast-duration-hint"
          />
          <span class="cv-error" id="pref-toast-duration-error" aria-live="polite" hidden></span>
          <span
            class="cv-hint"
            id="pref-toast-duration-hint"
            data-i18n="prefs.toastDurationHint"
          ></span>
        </div>

        <div class="cv-field">
          <label
            class="cv-label"
            for="pref-trash-retention"
            data-i18n="prefs.trashRetention"
          ></label>
          <input
            class="cv-input cv-input--mono lc-pref-duration-input"
            id="pref-trash-retention"
            name="trash-retention-days"
            type="number"
            min="1"
            max="365"
            step="1"
            inputmode="numeric"
            value="30"
            required
            aria-describedby="pref-trash-retention-hint"
          />
          <span class="cv-error" id="pref-trash-retention-error" aria-live="polite" hidden></span>
          <span
            class="cv-hint"
            id="pref-trash-retention-hint"
            data-i18n="prefs.trashRetentionHint"
          ></span>
        </div>

        <div class="cv-field">
          <span class="cv-label" data-i18n="statuses.listLabel"></span>
          <div>
            <button type="button" class="cv-btn" id="btn-pref-open-statuses">
              <i class="ph ph-columns cv-icon" aria-hidden="true"></i>
              <span data-i18n="palette.statuses"></span>
            </button>
          </div>
          <span class="cv-hint" data-i18n="prefs.kanbanHint"></span>
        </div>
      </div>
      <footer class="cv-modal__footer">
        <button type="button" class="cv-btn" data-cv-close data-i18n="common.close"></button>
      </footer>
    </dialog>

    <section class="cv-toast-region" data-i18n-attrs="aria-label:shell.notifications"></section>
  </body>
</html>
