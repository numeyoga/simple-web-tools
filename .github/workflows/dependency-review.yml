name: Dependency review

# Blocks a pull request that adds a vulnerable dependency or one whose license is not
# compatible with redistribution under MIT (see docs/decisions/0006-mit-license.md).
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, BSD-2-Clause, BSD-3-Clause, Apache-2.0, BlueOak-1.0.0,
            MPL-2.0, OFL-1.1, CC0-1.0, CC-BY-4.0, Python-2.0, Unlicense
          # uri-js (eslint > ajv@6, development only) is reported as
          # "BSD-2-Clause AND BSD-2-Clause-Views": both permissive and MIT-compatible.
          # robust-predicates (mermaid > d3 > delaunator, shipped in Slides) is reported as
          # "LicenseRef-scancode-public-domain AND Unlicense": public domain, nothing to comply with.
          # elkjs (mermaid, shipped in Slides' lazy ELK chunk) is "EPL-2.0 OR GPL-3.0-or-later";
          # we take EPL-2.0, which allows redistributing the unmodified code with its licence,
          # source on npm. Noted in apps/slides/README.md.
          # Pinned to the exact versions so that an update is reviewed again.
          allow-dependencies-licenses: >-
            pkg:npm/uri-js@4.4.1, pkg:npm/robust-predicates@3.0.3, pkg:npm/elkjs@0.12.1
          comment-summary-in-pr: on-failure
