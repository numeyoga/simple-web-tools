<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Chrono · suivi du temps</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/covenant.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    @keyframes cv-fade        { from { opacity: 0 } to { opacity: 1 } }
    @keyframes cv-modal-in    { from { opacity: 0; transform: translateY(8px) scale(0.98) } to { opacity: 1; transform: none } }
    @keyframes cv-pulse       { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes cv-slide-in    { from { opacity: 0; transform: translateY(-4px) } to { opacity: 1; transform: none } }
    html, body { margin: 0; height: 100%; }
    body { background: var(--cv-bg); color: var(--cv-fg); font-family: var(--cv-font-sans); }
    button, select, input, textarea { font-family: inherit; }
    *::-webkit-scrollbar        { width: 10px; height: 10px; }
    *::-webkit-scrollbar-thumb  { background: var(--cv-neutral-300); border-radius: 6px; border: 2px solid var(--cv-bg); }
    *::-webkit-scrollbar-thumb:hover { background: var(--cv-neutral-400); }
  </style>
</head>
<body data-screen-label="Chrono">
  <div id="root"></div>

  <script src="js/lib.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/PointageWidget.js"></script>
  <script src="js/Timeline.js"></script>
  <script src="js/Todos.js"></script>
  <script src="js/Projets.js"></script>
  <script src="js/Rapport.js"></script>
  <script src="js/QuickAdd.js"></script>
  <script src="js/Workspaces.js"></script>
  <script src="js/App.js"></script>
</body>
</html>
